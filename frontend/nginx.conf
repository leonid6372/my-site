# Serves the SPA and proxies the API (plan §6.3). Visitors always get HTTPS.
# Certificates live in /etc/nginx/certs (see docker/40-tls-certs.sh): Let's Encrypt
# when DOMAIN is set and issued, otherwise a self-signed fallback.

# Port 80: only Let's Encrypt challenges; everything else is redirected to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API (the Accept-Language header is forwarded unchanged).
  location /api/ {
    # The API speaks HTTPS only. Its certificate is self-signed unless
    # TLS_CERT_FILE/TLS_KEY_FILE are set, so it is not verified on this
    # internal Docker network hop.
    proxy_pass https://api:8080;
    proxy_ssl_server_name on;
    proxy_ssl_name api;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Content-hashed build output: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The SPA shell must always be revalidated, so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes (/, /travel?place=…, unknown paths) all get the SPA shell.
  location / {
    try_files $uri /index.html;
  }
}
