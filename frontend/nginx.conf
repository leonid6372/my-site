# Serves the SPA and proxies the API (plan §6.3).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API (Accept-Language and If-None-Match are forwarded unchanged).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Content-hashed build output: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The SPA shell must always be revalidated, so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes (/main, /travel?place=…, unknown paths) all get the SPA shell.
  location / {
    try_files $uri /index.html;
  }
}
