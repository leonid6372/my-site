# Production stack (plan §9.2). Copy .env.example to .env and set the password first.
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      CONTENT_DIR: /app/content
      LOG_LEVEL: info
    # Content is bind-mounted: edit content/, then `docker compose restart api` (no rebuild).
    volumes: ["./content:/app/content:ro"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    # Health comes from the image's HEALTHCHECK (/api healthcheck).

  # nginx: serves the SPA and proxies /api to api:8080. The only published port.
  web:
    build: ./frontend
    ports: ["80:80"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
